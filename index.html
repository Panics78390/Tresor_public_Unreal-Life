
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de Bord Administrateur</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6fb}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100%;background:#fff;border-right:1px solid #ddd;padding:20px}
.main{margin-left:260px;padding:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:20px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
button{padding:10px 15px;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="sidebar">
<h2>TRÉSOR PUBLIC</h2>
<p>Gestion des Entreprises</p>
<hr>
<p>🏠 Tableau de bord</p>
<p>🏢 Entreprises</p>
<p>📄 Déclarations</p>
<p>💰 Taxes & Paiements</p>
</div>

<div class="main">
<h1>TABLEAU DE BORD ADMINISTRATEUR</h1>

<div class="cards">
<div class="card"><h3>CA Total</h3><h2 id="ca">18 450 000 €</h2></div>
<div class="card"><h3>Bénéfice</h3><h2 id="benef">7 260 000 €</h2></div>
<div class="card"><h3>Taxes</h3><h2 id="taxe">1 386 750 €</h2></div>
<div class="card"><h3>Déclarations</h3><h2 id="dec">356 / 468</h2></div>
</div>

<table>
<thead>
<tr><th>Entreprise</th><th>Bénéfice</th><th>Taxes</th><th>Statut</th></tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<br>
<button onclick="addCompany()">Ajouter une entreprise</button>
</div>

<script>
const companies=[
["Autosphere","2145000 €","428250 €","À jour"],
["Garage Nolaws","1532000 €","306400 €","À jour"],
["Oil Industrie","1248000 €","249600 €","À jour"]
];

function render(){
 const body=document.getElementById("tbody");
 body.innerHTML="";
 companies.forEach(c=>{
  body.innerHTML+=`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td></tr>`;
 });
}
function addCompany(){
 const name=prompt("Nom entreprise");
 if(name){
   companies.push([name,"0 €","0 €","En attente"]);
   render();
 }
}
render();
</script>
</body>
</html>
